<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /* 尺寸由渲染脚本注入，绝不用 vw/vh —— 无头浏览器的真实视口和
     --window-size 不是一回事，用视口单位会把图标摊大再被裁掉一角 */
  #icon { display: block; }
</style>
</head>
<body>

<!--
  「生成火花」：上方火花 = AI 生成，下方频谱 = 音频输出。
  语义正好是这个工具做的事：把一个想法变成声音。

  小尺寸可读性是硬约束（任务栏 16px）：
  - 频谱柱宽 28/256 ≈ 11% —— 16px 下约 1.8px，还能立住；
    早期版本用 20 宽只有 1.25px，会碎成小点
  - 火花占上半区且四角外扩，即使柱子糊了，整体轮廓仍认得出
  - 只用两种元素、一个颜色，不靠细节支撑识别
-->
<svg id="icon" width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#ffc873"/>
      <stop offset="45%"  stop-color="#f0a53c"/>
      <stop offset="100%" stop-color="#bd6612"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#plate)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>

  <!-- 火花：凹边四角星，比直线星形更精致 -->
  <path d="M128 26 Q137 74 186 84 Q137 94 128 142 Q119 94 70 84 Q119 74 128 26 Z"
        fill="#2a1a04"/>

  <!-- 频谱：基线对齐 y=218，高度错落 -->
  <g fill="#2a1a04">
    <rect x="36"  y="192" width="28" height="26" rx="14"/>
    <rect x="75"  y="172" width="28" height="46" rx="14"/>
    <rect x="114" y="156" width="28" height="62" rx="14"/>
    <rect x="153" y="178" width="28" height="40" rx="14"/>
    <rect x="192" y="194" width="28" height="24" rx="14"/>
  </g>
</svg>
</body>
</html>
